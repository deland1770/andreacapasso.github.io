<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>

    <nav class="site-nav">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger">
        <span class="menu-icon">
          <svg viewBox="0 0 18 15" width="18px" height="15px">
            <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.696,18,13.516L18,13.516z"/>
          </svg>
        </span>
      </label>

      <div class="trigger custom-menu-container">
        <a class="page-link" href="{{ '/research' | relative_url }}">Research</a>
        <a class="page-link" href="{{ '/PI' | relative_url }}">PI</a>

        <!-- DROPDOWN DE PEOPLE -->
        <div class="custom-dropdown">
          <a class="page-link custom-dropbtn" href="{{ '/people' | relative_url }}">People &#9662;</a>
          <div class="custom-dropdown-content">
            <a href="{{ '/people#researchers' | relative_url }}">Researchers</a>
            <a href="{{ '/people#students' | relative_url }}">Students</a>
            <a href="{{ '/people#former-members' | relative_url }}">Former Members</a>
          </div>
        </div>

        <a class="page-link" href="{{ '/publications' | relative_url }}">Publications</a>
        <a class="page-link" href="{{ '/photo' | relative_url }}">Photos</a>
        <a class="page-link" href="{{ '/news' | relative_url }}">News</a>
      </div>
    </nav>
  </div>
</header>

<style>
/* Força o menu a ficar todo alinhado na horizontal */
.custom-menu-container {
  display: flex !important;
  align-items: center !important;
  gap: 15px !important;
  flex-direction: row !important;
}

.custom-menu-container .page-link {
  margin-left: 0 !important;
}

/* Container do dropdown */
.custom-dropdown {
  position: relative !important;
  display: inline-block !important;
}

/* Janela suspensa (Escondida por padrão) */
.custom-dropdown-content {
  display: none;
  position: absolute !important;
  top: 100% !important;
  left: 0 !important;
  background-color: #ffffff !important;
  min-width: 170px !important;
  box-shadow: 0px 8px 16px rgba(0,0,0,0.15) !important;
  border-radius: 4px !important;
  border: 1px solid #e1e1e1 !important;
  padding: 6px 0 !important;
  z-index: 9999 !important;
}

/* Links dentro da janela suspensa */
.custom-dropdown-content a {
  color: #333333 !important;
  padding: 8px 16px !important;
  text-decoration: none !important;
  display: block !important;
  font-size: 14px !important;
  text-align: left !important;
  white-space: nowrap !important;
}

.custom-dropdown-content a:hover {
  background-color: #f5f5f5 !important;
  color: #000000 !important;
}

/* Mostra a janela suspensa quando passa o rato por cima */
.custom-dropdown:hover .custom-dropdown-content {
  display: block !important;
}
</style>
