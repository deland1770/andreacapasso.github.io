<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>

    <nav class="site-nav">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger">
        <span class="menu-icon">
          <svg viewBox="0 0 18 15" width="18px" height="15px">
            <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.696,18,13.516L18,13.516z"/>
          </svg>
        </span>
      </label>

      <div class="trigger custom-nav-bar">
        <a class="page-link" href="{{ '/research' | relative_url }}">Research</a>

        <!-- DROPDOWN -->
        <div class="custom-dropdown">
          <a class="page-link custom-dropbtn" href="javascript:void(0);">People &#9662;</a>
          <div class="custom-dropdown-menu">
            <a href="{{ '/PI' | relative_url }}">Principal Investigator</a>
            <a href="{{ '/members' | relative_url }}">Members</a>
            <a href="{{ '/former-members' | relative_url }}">Former Members</a>
          </div>
        </div>

        <a class="page-link" href="{{ '/publications' | relative_url }}">Publications</a>
        <a class="page-link" href="{{ '/news' | relative_url }}">News</a>
      </div>
    </nav>
  </div>
</header>

<style>
/* Responsive Site Wrapper */
.wrapper {
  max-width: 1100px !important;
  width: 100% !important;
  padding-left: 15px !important;
  padding-right: 15px !important;
  box-sizing: border-box !important;
}  

/* Global rule to prevent any image from causing horizontal scrolling */
img {
  max-width: 100% !important;
  height: auto;
  object-fit: contain; /* Ensures images never get forced/cropped */
}

/* DESKTOP STYLES (Screen widths larger than 600px) */
@media (min-width: 601px) {
  .custom-nav-bar {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 12px !important;
  }

  .custom-nav-bar .page-link {
    margin-left: 0 !important;
  }

  .custom-dropdown {
    position: relative !important;
    display: inline-block !important;
  }

  .custom-dropdown-menu {
    display: none;
    position: absolute !important;
    top: 100% !important;
    left: 0 !important;
    background-color: #ffffff !important;
    min-width: 150px !important;
    padding: 4px 0 !important;
    box-shadow: 0px 4px 12px rgba(0,0,0,0.15) !important;
    border: 1px solid #e1e1e1 !important;
    border-radius: 4px !important;
    z-index: 9999 !important;
  }

  .custom-dropdown:hover .custom-dropdown-menu {
    display: block !important;
  }
}

/* SHARED DROPDOWN LINK STYLES */
.custom-dropdown-menu a {
  font-family: inherit !important;
  font-weight: inherit !important;
  color: #333333 !important;
  padding: 6px 12px !important;
  font-size: 13px !important;
  line-height: 1.2 !important;
  text-decoration: none !important;
  display: block !important;
  white-space: nowrap !important;
  text-align: left !important;
}

.custom-dropdown-menu a:hover {
  background-color: #f0f0f0 !important;
  color: #000000 !important;
}

/* MOBILE RESPONSIVE STYLES (Screen widths 600px and below) */
@media (max-width: 600px) {
  /* Force site-nav header elements above slideshow and overlays */
  .site-header {
    position: relative !important;
    z-index: 99999 !important;
  }

  .site-nav {
    z-index: 99999 !important;
  }

  /* Ensures the expanded mobile drawer sits on top of page content */
  .site-nav .trigger {
    position: absolute !important;
    right: 15px !important;
    top: 100% !important;
    background-color: #ffffff !important;
    border: 1px solid #e1e1e1 !important;
    box-shadow: 0px 4px 12px rgba(0,0,0,0.15) !important;
    border-radius: 4px !important;
    padding: 10px 15px !important;
    z-index: 99999 !important;
  }

  .custom-dropdown {
    display: block !important;
  }

  /* Submenu hidden by default on mobile */
  .custom-dropdown-menu {
    display: none !important;
    position: static !important;
    box-shadow: none !important;
    border: none !important;
    padding-left: 15px !important;
    background-color: transparent !important;
  }

  /* Active class toggles visibility when tapped on mobile */
  .custom-dropdown.active .custom-dropdown-menu {
    display: block !important;
  }
}
</style>

<!-- SCRIPT FOR MOBILE DROPDOWN TOGGLE AND AUTO-CLOSE -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const navTrigger = document.getElementById("nav-trigger");
  const dropBtn = document.querySelector(".custom-dropbtn");
  const dropdownParent = document.querySelector(".custom-dropdown");
  const subLinks = document.querySelectorAll(".custom-dropdown-menu a");
  const navLinks = document.querySelectorAll(".site-nav > .trigger > a");

  // Toggle People dropdown on tap (mobile)
  if (dropBtn && dropdownParent) {
    dropBtn.addEventListener("click", function (e) {
      if (window.innerWidth <= 600) {
        e.preventDefault();
        dropdownParent.classList.toggle("active");
      }
    });
  }

  // Close mobile drawer when clicking subpage links
  subLinks.forEach(function (link) {
    link.addEventListener("click", function () {
      if (navTrigger) {
        navTrigger.checked = false;
      }
      if (dropdownParent) {
        dropdownParent.classList.remove("active");
      }
    });
  });

  // Close mobile drawer when clicking top-level links
  navLinks.forEach(function (link) {
    link.addEventListener("click", function () {
      if (navTrigger) {
        navTrigger.checked = false;
      }
    });
  });
});
</script>
